name: Dev build (branch dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch.b64 if present
        run: |
          if [ -f patch.b64 ]; then
            base64 -d patch.b64 | tar -xz
            rm -f patch.b64
            git config user.name "FOKOF2 build"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "Apply patch" || true
            git push origin HEAD:dev
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK platform 36.1
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Tests and debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --continue testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Publish review output to branch review-output
        if: always()
        run: |
          rm -rf /tmp/rev && mkdir -p /tmp/rev
          cp -r app/build/screenshots /tmp/rev/ 2>/dev/null || true
          mkdir -p /tmp/rev/tests && cp app/build/test-results/testDebugUnitTest/*.xml /tmp/rev/tests/ 2>/dev/null || true
          tail -n 400 build.log > /tmp/rev/build-tail.log 2>/dev/null || true
          grep -E "^e: |error:|FAILED|BUILD " build.log > /tmp/rev/build-errors.log 2>/dev/null || true
          echo "$GITHUB_SHA" > /tmp/rev/commit.txt
          cd /tmp/rev && git init -q && git checkout -q -b review-output
          git config user.name "FOKOF2 build" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "review output for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" review-output

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-results
          path: |
            app/build/screenshots/
            app/build/reports/tests/
          if-no-files-found: warn

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
